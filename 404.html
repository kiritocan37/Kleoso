<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Kleoso</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{--bg:#f0ebe1;--dark:#1c1812;--accent:#b85c2a;--muted:#6b6355}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--dark);font-family:system-ui,sans-serif;padding:2rem;text-align:center}
    h1{font-size:clamp(4rem,12vw,8rem);line-height:1;color:var(--accent)}
    p{margin:1rem 0 2rem;color:var(--muted);max-width:420px}
    a{display:inline-block;background:var(--dark);color:var(--bg);padding:.9rem 1.6rem;text-decoration:none;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page does not exist or has moved.</p>
    <a href="/">Back to Kleoso</a>
  </main>
</body>
</html>
